[workspace]
members = ["rmk_device", "rmk_format", "rmk_fs", "rmk"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Matthieu Dartiguenave <matthieu@dartiguenave.me>"]
description = "Rmk fs"

[workspace.dependencies]
thiserror = "1"
log = "0.4"
pretty_env_logger = "0.5"
anyhow = "1"
snafu = "0.8.4"

lazy_static = "1"

console-subscriber = "0.3.0"
tokio-console = "0.1.12"
tracing = "0.1.40"

serde = { version = "1", features = ["derive"] }
serde_with = { version = "3.9.0", features = ["chrono_0_4"] }

toml = "0.8.19"
serde_json = "1"

bytes = "1.7.1"

config = { version = "0.14.0", features = ["toml"] }
directories = "5.0.1"
tempfile = "3"

derive_builder = "0.20.0"

opendal = { version = "0.49", features = ["services-sftp", "services-fs"] }

futures = "0.3.30"
async-trait = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "time",
    "sync",
    "tracing",
    "parking_lot",
] }
tokio-util = "0.7.11"

indextree = "4.7.2"
chrono = "0.4.38"


opendal-mount = { version = "*", path = "../opendal-mount" }
